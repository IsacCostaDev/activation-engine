services:
  postgres:
    image: postgres:16-alpine
    container_name: activation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: activation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activation_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: activation-wiremock
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: activation-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/activation_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PROVIDER_BASE_URL: http://wiremock:8080
      SECURITY_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started

volumes:
  postgres-data:
